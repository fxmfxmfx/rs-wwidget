name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev python3 desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format and lint
        run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings
      - name: Build and test
        run: ./build.sh
      - name: Render without a display server
        run: ./rs-wwidget --preview /tmp/widgets.png
