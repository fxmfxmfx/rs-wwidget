name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libgtk-layer-shell-dev python3 desktop-file-utils
      - name: Build and test
        run: ./build.sh
      - name: Render without a display server
        run: ./desktop-widgets --preview /tmp/widgets.png
