[package]
name = "rs-wwidget"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Small single-threaded Gruvbox Wayland desktop widgets"

[dependencies]
cairo-rs = { version = "0.22", default-features = false, features = ["png"] }
pango = "0.22"
pangocairo = "0.22"
libc = "0.2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
